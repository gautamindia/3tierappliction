name: Deploy
on:
  push:
    branches:
      - main
    paths:
      - "app/**"
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Download latest artifact from another workflow
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: terraform.yml # The filename of your producer workflow
          name: terraform-outputs
          branch: main # Optional: only look for runs on this branch
      
     


      # -----------------------------
      # Get values
      # -----------------------------
      - name: Load Terraform outputs
        run: |
          DB_PORT=$(jq -r '.db_port.value' terraform-outputs.json)
          DB_HOST=$(jq -r '.db_host.value' terraform-outputs.json)
          BACKEND_PRIVATE_IP=$(jq -r '.backend_private_ip.value' terraform-outputs.json)
          BACKEND_PUBLIC_IP=$(jq -r '.backend_public_ip.value' terraform-outputs.json)
          FRONTEND_PUBLIC_IP=$(jq -r '.frontend_public_ip.value' terraform-outputs.json)    

          echo "DB_PORT=$DB_PORT" >> "$GITHUB_ENV"
          echo "DB_HOST=$DB_HOST" >> "$GITHUB_ENV"
          echo "BACKEND_PRIVATE_IP=$BACKEND_PRIVATE_IP" >> "$GITHUB_ENV"
          echo "BACKEND_PUBLIC_IP=$BACKEND_PUBLIC_IP" >> "$GITHUB_ENV"
          echo "FRONTEND_PUBLIC_IP=$FRONTEND_PUBLIC_IP"


      - name: Deploy to EC2 backend
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.BACKEND_PUBLIC_IP}}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cat > /opt/app/backend/.env <<EOF
            DB_HOST=${{ env.DB_HOST }}
            DB_PORT=${{env.DB_PORT}}
            DB_USER=${{ secrets.DB_USER }}
            DB_NAME=${{secrets.DB_NAME}}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            REPO_URL=${{secrets.REPO_URL}}
            EOF
            <<EOF
            chmod 600 /opt/app/backend/.env
            sudo dnf update -y
            sudo dnf install -y python3 python3-pip git
            git clone https://github.com/gautamindia/3tierappliction.git
            cp -f /home/ec2-user/3tierappliction/app/backend/requirements.txt /opt/app/backend/requirements.txt
            cp -f /home/ec2-user/3tierappliction/app/backend/app.py /opt/app/backend/app.py
            rm -rf 3tierappliction
            cd /opt/app/backend
            set -a
            source .env
            set +a
          
            
            python3 -m venv venv
            source venv/bin/activate
            pip install -r requirements.txt
            python3 app.py 
            EOF 

      - name: Deploy to EC2 frontend
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.FRONTEND_PUBLIC_IP}}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cat > /opt/app/frontend/.env <<EOF
            BACKEND_PRIVATE_IP=${{env.BACKEND_PRIVATE_IP}}
            FLASK_SECRET_KEY=${{secrets.FLASK_SECRET_KEY}}
            REPO_URL=${{secrets.REPO_URL}}
            EOF
            chmod 600 /opt/app/frontend/.env
            cd /opt/app/frontend
            set -a
            source .env
            set +a
            sudo chmod +x deploy.sh
            ./deploy.sh